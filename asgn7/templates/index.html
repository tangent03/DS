<!DOCTYPE html>
<html>

<head>

    <title>Calculator</title>

    <style>

        body{

            background:#dcdcdc;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            font-family:Arial;
        }

        .calculator{

            background:white;
            width:320px;
            padding:20px;
            border-radius:15px;
            box-shadow:0 0 15px rgba(0,0,0,0.3);
        }

        .display{

            width:100%;
            height:70px;
            font-size:35px;
            text-align:right;
            margin-bottom:20px;
            border:none;
            outline:none;
            background:#f5f5f5;
            border-radius:10px;
            padding-right:10px;
            box-sizing:border-box;
        }

        .buttons{

            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:10px;
        }

        button{

            height:60px;
            border:none;
            border-radius:10px;
            font-size:22px;
            cursor:pointer;
            background:#e0e0e0;
        }

        .operator{

            background:#14b8a6;
            color:white;
        }

        .equal{

            background:#14b8a6;
            color:white;
        }

        .clear{

            background:#ff5c5c;
            color:white;
        }

        .result{

            margin-top:15px;
            text-align:center;
            padding:10px;
            border-radius:10px;
            background:#333;
            color:white;
            font-size:20px;
        }

        .error{

            background:#b00020;
        }

    </style>

</head>

<body>

<div class="calculator">

    <form action="/calculate" method="POST">

        <input type="hidden" name="operation" id="operation">

        <input type="hidden" name="num1" id="num1">

        <input type="hidden" name="num2" id="num2">

        <input type="text"
               id="display"
               class="display"
               readonly>

        <div class="buttons">

            <button type="button" onclick="press('7')">7</button>
            <button type="button" onclick="press('8')">8</button>
            <button type="button" onclick="press('9')">9</button>
            <button type="button" class="operator" onclick="setOp('/')">/</button>

            <button type="button" onclick="press('4')">4</button>
            <button type="button" onclick="press('5')">5</button>
            <button type="button" onclick="press('6')">6</button>
            <button type="button" class="operator" onclick="setOp('*')">*</button>

            <button type="button" onclick="press('1')">1</button>
            <button type="button" onclick="press('2')">2</button>
            <button type="button" onclick="press('3')">3</button>
            <button type="button" class="operator" onclick="setOp('-')">-</button>

            <button type="button" onclick="press('0')">0</button>
            <button type="button" onclick="press('.')">.</button>
            <button type="submit" class="equal">=</button>
            <button type="button" class="operator" onclick="setOp('+')">+</button>

            <button type="button"
                    class="clear"
                    style="grid-column: span 4;"
                    onclick="clearDisplay()">

                AC

            </button>

        </div>

    </form>

    {% if result %}

        {% if result.result is defined %}

            <div class="result">

                Result = {{ result.result }}

            </div>

        {% else %}

            <div class="result error">

                {{ result.error }}

            </div>

        {% endif %}

    {% endif %}

</div>

<script>

    let first = "";
    let second = "";
    let op = "";

    function press(value){

        let display = document.getElementById("display");

        if(op === ""){

            first += value;

        }else{

            second += value;
        }

        display.value += value;
    }

    function setOp(value){

        if(first === ""){

            alert("Enter first number");

            return;
        }

        if(op !== ""){

            alert("Operator already selected");

            return;
        }

        op = value;

        document.getElementById("display").value += value;
    }

    function clearDisplay(){

        first = "";
        second = "";
        op = "";

        document.getElementById("display").value = "";
    }

    document.querySelector("form").onsubmit = function(){

        if(first === "" || second === "" || op === ""){

            alert("Enter two numbers and an operator");

            return false;
        }

        document.getElementById("num1").value = first;

        document.getElementById("num2").value = second;

        if(op === "+")
            document.getElementById("operation").value = "add";

        else if(op === "-")
            document.getElementById("operation").value = "subtract";

        else if(op === "*")
            document.getElementById("operation").value = "multiply";

        else if(op === "/")
            document.getElementById("operation").value = "divide";
    }

</script>

</body>
</html>
